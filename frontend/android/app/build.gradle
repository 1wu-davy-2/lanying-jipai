apply plugin: 'com.android.application'

def updateProperties = new Properties()
def updatePropertiesFile = rootProject.file('update.properties')
if (updatePropertiesFile.exists()) {
    updatePropertiesFile.withInputStream { updateProperties.load(it) }
}
def androidUpdateManifestUrl = updateProperties.getProperty('androidUpdateManifestUrl', '')
def escapedAndroidUpdateManifestUrl = androidUpdateManifestUrl.replace('\\', '\\\\').replace('"', '\\"')

def releaseSigningProperties = new Properties()
def releaseSigningPropertiesFile = rootProject.file('signing.properties')
if (releaseSigningPropertiesFile.exists()) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
}
def requiredReleaseSigningKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def missingReleaseSigningKeys = requiredReleaseSigningKeys.findAll { !releaseSigningProperties.getProperty(it)?.trim() }
def hasReleaseSigningConfig = releaseSigningPropertiesFile.exists() && missingReleaseSigningKeys.isEmpty()
def releaseSigningErrorMessage = releaseSigningPropertiesFile.exists()
    ? "Release signing configuration is incomplete. Missing: ${missingReleaseSigningKeys.join(', ')}."
    : "Release signing configuration is missing. Copy signing.properties.example to signing.properties."

android {
    namespace = "com.lanying.jipai"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.lanying.jipai"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "ANDROID_UPDATE_MANIFEST_URL", "\"${escapedAndroidUpdateManifestUrl}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        if (hasReleaseSigningConfig) {
            release {
                storeFile rootProject.file(releaseSigningProperties.getProperty('storeFile'))
                storePassword releaseSigningProperties.getProperty('storePassword')
                keyAlias releaseSigningProperties.getProperty('keyAlias')
                keyPassword releaseSigningProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigningConfig) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.configureEach { task ->
    if (task.name in ['signingConfigWriterRelease', 'signReleaseBundle', 'packageRelease', 'assembleRelease', 'bundleRelease']) {
        task.doFirst {
            if (!hasReleaseSigningConfig) {
                throw new GradleException(releaseSigningErrorMessage)
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
