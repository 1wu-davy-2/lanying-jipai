server {
    listen 80;
    server_name your-domain.example;

    # Keep this path available for the initial and renewal ACME challenges.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name your-domain.example;

    ssl_certificate /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;
    client_max_body_size 20m;

    location / {
        root /opt/lanying-jipai/frontend-dist;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        # Legacy local media only. New production uploads use absolute MinIO media URLs.
        alias /opt/lanying-jipai/backend/uploads/;
        autoindex off;
    }

    location = /releases {
        return 404;
    }

    location /releases/ {
        alias /opt/lanying-jipai/releases/;
        autoindex off;
        default_type application/vnd.android.package-archive;
        add_header X-Content-Type-Options nosniff always;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }
}
