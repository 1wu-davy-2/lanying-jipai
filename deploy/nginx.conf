server {
    listen 80;
    server_name your-domain.example;
    client_max_body_size 20m;

    location / {
        root /opt/lanying-jipai/frontend-dist;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        # Legacy local media only. New production uploads use absolute MinIO media URLs.
        alias /opt/lanying-jipai/backend/uploads/;
        autoindex off;
    }

    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }
}
