server {
    listen 80;
    server_name media.your-domain.example;

    # certbot should upgrade this virtual host to HTTPS before it is exposed.
    client_max_body_size 20m;

    location / {
        # The public domain hides the MinIO bucket and never exposes port 9000.
        proxy_pass http://127.0.0.1:9000/lanying-media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }
}
