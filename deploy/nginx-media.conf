server {
    listen 80;
    server_name media.your-domain.example;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name media.your-domain.example;

    ssl_certificate /etc/letsencrypt/live/media.your-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.your-domain.example/privkey.pem;
    client_max_body_size 20m;

    location / {
        # The public domain hides the MinIO bucket and never exposes port 9000.
        proxy_pass http://127.0.0.1:9000/lanying-media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
